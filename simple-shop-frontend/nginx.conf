# simple-shop 卖家前端 nginx 配置（方案乙）
# 依据：安装与部署手册 v1.0 §5.3
#   /seller/  -> 静态 SPA（含 history 回退）
#   /         -> 全部反向代理到后端（/api、/images、买家 JSP、/buyer 静态资源）
server {
    listen 80;
    server_name _;

    # ⚠️ 必须 >= 6MB：后端的超限上传要由应用返回业务码 20009，
    #    nginx 默认 1MB 会先返回 413，让契约要求的提示文案送不到前端。
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 卖家 SPA（构建 base=/seller/，产物在 /usr/share/nginx/html/seller/） ----
    location /seller/ {
        try_files $uri $uri/ /seller/index.html;
    }
    location = /seller {
        return 301 /seller/;
    }

    # ---- 其余全部交给后端 ----
    # 覆盖：/api/seller/**、/images/**、买家 JSP（/、/query、/intent/new）、/buyer/**
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 构建产物文件名带 hash，可长缓存
    location /seller/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
