# simple-shop 后端配置。所有环境相关值都可以用环境变量覆盖。

spring:
  application:
    name: simple-shop

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/simple_shop?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&connectionTimeZone=UTC&rewriteBatchedStatements=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  tomcat:
    max-swallow-size: 10MB

simple-shop:
  image:
    directory: ${IMAGE_DIR:./data/images}
    url-prefix: /images

  session:
    timeout: 30m
    timeout-tolerance: 60s

  queue:
    max-size: 1000

  rate-limit:
    register-per-minute: 10
    login-per-minute: 10
    submit-intention-per-minute: 10

  pagination:
    default-size: 10
    max-size: 100

logging:
  level:
    org.hibernate.SQL: info
