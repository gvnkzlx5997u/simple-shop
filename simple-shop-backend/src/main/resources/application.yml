# simple-shop 后端配置。所有环境相关值都可以用环境变量覆盖。

spring:
  application:
    name: simple-shop

  servlet:
    multipart:
      # 视频单文件上限 20MB；图片在 Service 层按用途另行限制 5MB。
      max-file-size: 20MB
      max-request-size: 25MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/simple_shop?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&connectionTimeZone=UTC&rewriteBatchedStatements=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # 库内时间 = UTC 的成立条件（回归测试 StorageTimeZoneTest 守门）：
          # 1) 实体时间字段一律标注 @JdbcTypeCode(SqlTypes.LOCAL_DATE_TIME)，setObject 字面量直传，
          #    与 JVM/会话时区无关；漏标注会退回 setTimestamp 绑定，库内时间静默偏移一个时区差。
          # 2) 应用入口把 JVM 默认时区钉为 UTC、连接串 connectionTimeZone=UTC 钉住会话时区，作漏标注时的兜底。
          # 3) 此处不配 hibernate.jdbc.time_zone：它改变不了默认绑定的会话时区渲染行为，曾掩盖问题定位。
          batch_size: 50
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  tomcat:
    # 需要覆盖略超 20MB 的上传请求，才能把业务错误响应正常发回客户端。
    max-swallow-size: 25MB

simple-shop:
  media:
    # 媒体根目录。保留 IMAGE_DIR 作为阶段一部署变量的兼容回退。
    directory: ${MEDIA_DIR:${IMAGE_DIR:./data/media}}
    url-prefix: /media
    # 商品图片与描述图片是两套独立限制，当前取值相同，后续可分别调整。
    goods-image-max-size: 5MB
    description-image-max-size: 5MB
    description-video-max-size: 20MB

  session:
    timeout: 30m
    timeout-tolerance: 60s

  queue:
    max-size: 1000

  rate-limit:
    register-per-minute: 10
    login-per-minute: 10
    submit-intention-per-minute: 10

  pagination:
    default-size: 10
    max-size: 100

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  level:
    org.hibernate.SQL: info
