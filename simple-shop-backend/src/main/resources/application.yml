# =============================================================================
# simple-shop 数据层配置
# 依据：《数据库与数据层设计说明书》v1.2 §9.3（环境与配置项）、§4.8（时间列与 UTC）、§9.1（schema 版本化）
# 本文件每项取值均有设计依据，请勿自行调整。
# =============================================================================

spring:
  application:
    name: simple-shop

  # 本阶段不含 web 层（§1.2），以非 web 方式启动：
  # 上下文初始化完成（连库 → Flyway 迁移 → 结构校验）后正常退出，不占端口。
  # 后续加入 web 层时删除本项。
  main:
    web-application-type: none

  # ---------------------------------------------------------------------------
  # 数据源（§9.3）
  # 连接串参数说明：
  #   characterEncoding=UTF-8    —— 与库/表 utf8mb4（§3.3、§9.2.7）配套。
  #                                 ⚠️ 实现口径修正：§9.3 的示例写作 characterEncoding=utf8mb4，
  #                                 但该参数取值是 **Java 字符集名**，Connector/J 会拒绝
  #                                 `utf8mb4`（Unsupported character encoding 'utf8mb4'）。
  #                                 正确写法为 UTF-8——驱动据此把客户端字符集协商为 utf8mb4
  #                                 （实测 client/connection 均为 utf8mb4），语义与设计一致。
  #   connectionCollation=utf8mb4_unicode_ci
  #                              —— 落实 §3.3「库/表排序规则 utf8mb4_unicode_ci」；
  #                                 服务端默认是 utf8mb4_0900_ai_ci，须显式指定。
  #   connectionTimeZone=UTC     —— 与 hibernate.jdbc.time_zone=UTC 一并设置，
  #                                 避免 Connector/J 驱动层二次时区转换（§4.8）
  #   rewriteBatchedStatements   —— §9.3 指定
  #   createDatabaseIfNotExist   —— 便于本机首次启动；库字符集随服务端默认 utf8mb4
  #
  # 三项均可用环境变量覆盖（默认值即本机开发库），测试用 application-test.yml 指向独立库，
  # 避免自测污染开发数据。
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/simple_shop?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&connectionTimeZone=UTC&rewriteBatchedStatements=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---------------------------------------------------------------------------
  # JPA / Hibernate（§9.3、§9.1）
  #   ddl-auto=validate       —— 表由 Flyway 建（§9.1）；validate 用于核对实体与库结构，
  #                             可发现列宽/列名/可空性不符（推荐的自检手段）
  #   open-in-view=false      —— 本阶段无 web 层，避免遗留依赖 OSIV 的懒加载
  #   二级缓存                 —— 不配置（C-04 已排除缓存组件）
  # 注意：validate 不检查 CHECK 约束与索引（§9.1 已知局限），需靠脚本评审与集成测试保证。
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50

  # ---------------------------------------------------------------------------
  # Flyway（§9.1）
  # 脚本位置 src/main/resources/db/migration，脚本命名 V1__baseline_schema.sql
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration

# -----------------------------------------------------------------------------
# 日志：开发环境打开 Hibernate SQL，便于核对 §7 的取数口径（§9.3）
# -----------------------------------------------------------------------------
logging:
  level:
    org.hibernate.SQL: debug
    # 绑定参数值可与 SQL 对照，核对 UTC 写入是否符合预期
    org.hibernate.orm.jdbc.bind: trace
