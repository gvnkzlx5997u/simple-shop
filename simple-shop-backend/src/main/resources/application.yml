# =============================================================================
# simple-shop 后端配置
# 数据层部分依据：《数据库与数据层设计说明书》v1.2 §9.3（环境与配置项）、§4.8（时间列与 UTC）、§9.1（schema 版本化）
# 业务层部分依据：《后端业务层与卖家端接口层开发方案》§2.2、§5、§6
# =============================================================================

spring:
  application:
    name: simple-shop

  # ---------------------------------------------------------------------------
  # 已移除 spring.main.web-application-type: none
  #   数据层阶段以非 web 方式启动（初始化完成即退出、不占端口）。
  #   本轮新增 Service 层与卖家端 REST 接口层（第 11 章 I11-01 ~ I11-16），
  #   必须启动 servlet 容器；不写该项即为默认的 SERVLET。
  #   ⚠️ SimpleShopApplication 主类无需任何改动（其注释已预告此项的删除）。
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 文件上传上限（C-14、NFR-11）
  #   max-file-size     单文件 5MB —— 商品图片单张上限
  #   max-request-size  6MB     —— 留出 multipart 边界与其它表单字段的余量
  #   ⚠️ 这是 Spring 层的【软阈值】：超限时会在进入 Controller 之前抛
  #      MaxUploadSizeExceededException，必须由 GlobalExceptionHandler 捕获并
  #      映射为业务码 20009（见方案 §6）。否则会变成 500，违反接口契约。
  #   ⚠️ 它【不能替代】Service 层的独立校验（NFR-11 要求前后端双重校验、
  #      且「绕过前端直传 >5MB 仍被拒」要能成立）。
  #   ⚠️⚠️ 还【必须】配合下面的 server.tomcat.max-swallow-size ——
  #      只设这里，超限响应发不出去（真实端口实测：连接被直接断开）。详见该处说明。
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ---------------------------------------------------------------------------
  # 数据源（§9.3）
  # 连接串参数说明：
  #   characterEncoding=UTF-8    —— 与库/表 utf8mb4（§3.3、§9.2.7）配套。
  #                                 ⚠️ 实现口径修正：§9.3 的示例写作 characterEncoding=utf8mb4，
  #                                 但该参数取值是 **Java 字符集名**，Connector/J 会拒绝
  #                                 `utf8mb4`（Unsupported character encoding 'utf8mb4'）。
  #                                 正确写法为 UTF-8——驱动据此把客户端字符集协商为 utf8mb4
  #                                 （实测 client/connection 均为 utf8mb4），语义与设计一致。
  #   connectionCollation=utf8mb4_unicode_ci
  #                              —— 落实 §3.3「库/表排序规则 utf8mb4_unicode_ci」；
  #                                 服务端默认是 utf8mb4_0900_ai_ci，须显式指定。
  #   connectionTimeZone=UTC     —— 与 hibernate.jdbc.time_zone=UTC 一并设置，
  #                                 避免 Connector/J 驱动层二次时区转换（§4.8）
  #   rewriteBatchedStatements   —— §9.3 指定
  #   createDatabaseIfNotExist   —— 便于本机首次启动；库字符集随服务端默认 utf8mb4
  #
  # 三项均可用环境变量覆盖（默认值即本机开发库），测试用 application-test.yml 指向独立库，
  # 避免自测污染开发数据。
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/simple_shop?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&connectionTimeZone=UTC&rewriteBatchedStatements=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---------------------------------------------------------------------------
  # JPA / Hibernate（§9.3、§9.1）
  #   ddl-auto=validate       —— 表由 Flyway 建（§9.1）；validate 用于核对实体与库结构，
  #                             可发现列宽/列名/可空性不符（推荐的自检手段）
  #   open-in-view=false      —— ⚠️ 本轮起这一项【必须保持 false】：
  #                             Service 层必须返回 DTO、不得把实体带出事务边界，
  #                             否则会触发 LazyInitializationException（方案风险 R9）。
  #   二级缓存                 —— 不配置（C-04 已排除缓存组件；实测日志为 "Second-level cache disabled"）
  # 注意：validate 不检查 CHECK 约束与索引（§9.1 已知局限），需靠脚本评审与集成测试保证。
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # -------------------------------------------------------------------
          # JDBC 批处理（S10 性能实测后新增，见 §8.14）
          #
          # ⚠️ 为什么必须显式设置：不设时 Hibernate 的批处理大小默认为 0（= 关闭），
          #    于是「归档 1000 条意向」会发 1000 条 INSERT + 1000 条 DELETE，
          #    **每条一次数据库往返**。实测代价：下架归档 1000 条意向 = 3626 ms，
          #    而 §8.4／12-P1 对写操作的指标是 ≤ 1s —— 超了 3.6 倍。
          #    更危险的是它会逼近卖家写操作的 @Transactional(timeout = 5)（DEC-DB-13）：
          #    最坏情况的归档只剩 1.4 倍余量，机器稍慢就会撞上超时。
          #
          # 设为 50 后：1000 条变成 20 个批次；配合连接串里已有的
          # rewriteBatchedStatements=true（§9.3 指定），驱动会把它们改写成多值语句。
          #
          # ⚠️ 三处需要留意（都已实测过，见 §8.14 的验证证据）：
          #  ① 本项【只影响性能，不影响语义】：单行写入（发布商品、提交意向等）本就无批可批；
          #  ② 归档的【插入顺序】不受影响：历史商品由 saveAndFlush 单独落定，
          #     与历史意向不在同一次 flush 中（详见 ArchiveService 的类注释）；
          #  ③ 归档的【删除顺序】也不受影响：ArchiveServiceTest 里 25 条意向的用例
          #     会因 FK 违例而失败，若批处理改动了删除顺序，那条用例会立刻变红。
          # -------------------------------------------------------------------
          batch_size: 50
        default_batch_fetch_size: 50

  # ---------------------------------------------------------------------------
  # Flyway（§9.1）
  # 脚本位置 src/main/resources/db/migration，脚本命名 V1__baseline_schema.sql
  # ⚠️ 本轮【不新增、不修改】任何迁移脚本（已发布脚本改动包括注释都会导致校验和失配）
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration

# =============================================================================
# servlet 容器（Tomcat）
# -----------------------------------------------------------------------------
# max-swallow-size —— 请求被拒后，Tomcat 允许「吞掉」多少【尚未读取】的请求体，
#                     以便把错误响应正常发回客户端。
#
# ⚠️ 为什么必须显式调大（这是一个真实端口实测出来的缺陷，不是预防性配置）：
#    Tomcat 的默认值是 2MB。当上传超过 max-file-size 时，Spring/Tomcat 会在
#    【读到超限那一刻】就抛 SizeLimitExceededException（→ Spring 包装成
#    MaxUploadSizeExceededException → 我们的 20009），但此时请求体还有一大截没读。
#    Tomcat 要先把这个尾巴读完（swallow）才能在同一连接上发响应；
#    尾巴超过 max-swallow-size 时，它【直接断开连接】。
#    实测（6MB 的 JPEG，上限 5MB）：客户端得到
#      "Unable to write data to the transport connection: 远程主机强迫关闭了一个现有的连接"
#    ——即 20009 与 M10-31「仅支持 JPG／PNG，单张不超过 5MB」【根本没有送达】。
#    这恰好命中 NFR-11 的可测指标「绕过前端直传 >5MB 仍被拒绝【并提示 M10-31】」，
#    以及验收方式 V-02「必须包含绕过前端的负向调用」——前端只会显示一个网络错误。
#
# 取值：10MB。理由：
#   · 覆盖「略超 5MB」这一现实拒绝区间（前端自身限 5MB，绕过测试通常传 6MB 左右），
#     使这类请求都能拿到明确的 20009；
#   · 【有意不用 -1（不限）】：那意味着任何超大请求都会把连接里的字节全读一遍，
#     是一个白白送给攻击者的资源消耗面。超过 10MB 的请求仍会被拒绝，
#     只是以「断开连接」的形式——对这个只允许 5MB 的接口来说，二者的业务含义一致。
# =============================================================================
server:
  tomcat:
    max-swallow-size: 10MB

# =============================================================================
# simple-shop 业务配置（绑定到 com.simpleshop.config.AppProperties）
# 每项取值均有需求/设计依据，见各项注释。
# 全部支持环境变量覆盖，便于容器化部署（后端为单容器，见方案 §5）。
# =============================================================================
simple-shop:

  # ---------------------------------------------------------------------------
  # 图片存储（C-08、A-06、DEC-09、DEC-34、NFR-11、方案 §6）
  #   directory   服务器文件系统上的存放目录；数据库只存【相对路径】，不存二进制
  #   url-prefix  对外访问前缀；WebMvcConfig 会把 /images/** 映射到 directory
  #   ✅ 已定（Q-5/Q-6）：pic_url 返回【带前缀】的路径，如 /images/2026/10/<uuid>.jpg，
  #      前端 <img src> 可直接使用。
  #   ⚠️ 容器化部署时该目录【必须挂持久卷】——归档不搬迁图片（DEC-09），
  #      历史商品的图片也依赖这批文件，丢失即永久性数据丢失（方案 §5.3 第 1 条）。
  # ---------------------------------------------------------------------------
  image:
    directory: ${IMAGE_DIR:./data/images}
    url-prefix: /images

  # ---------------------------------------------------------------------------
  # 会话（C-07、DEC-13、DEC-17、NFR-04、12-P7；方案 §5）
  #   ✅ 已定（Q-3）：容器化部署、后端为【单容器】⇒ 会话在进程内解决
  #      （ConcurrentHashMap），不引入缓存组件、不新建会话表。
  #   timeout           30 分钟无操作自动退出（滑动过期）；值用 Spring 的 Duration 写法
  #   timeout-tolerance 超时判定宽容窗口 ±1 分钟（12-P7）
  #   ⚠️ 会话清理任务的间隔【不在此配置】：@Scheduled 的 fixedDelay 要求编译期常量，
  #      为它引入 SchedulingConfigurer 属过度设计。固定 60 秒，理由见 SessionStore 类注释。
  #   ⚠️ 若后端改为【多容器/多副本/负载均衡】，必须回头改共享存储并复核 C-04（方案 §5.4）
  # ---------------------------------------------------------------------------
  session:
    timeout: 30m
    timeout-tolerance: 60s

  # ---------------------------------------------------------------------------
  # 队列容量（DEC-23、NFR-07）
  #   max-size 单商品意向队列【非终态】条数上限；达到上限拒绝提交并提示 M10-12。
  #   ⚠️ 判定必须用 countNonTerminal(goodsId, {succeeded, failed, revoked})，
  #      且必须在【持有序号表行锁之后】计数，否则并发下可能突破上限。
  # ---------------------------------------------------------------------------
  queue:
    max-size: 1000

  # ---------------------------------------------------------------------------
  # 限流（NFR-17、12-P6；✅ 已定 Q-8：本轮在 Service 层实现最小版本）
  #   唯一的匿名写入口 = 提交购买意向接口：同一 IP 每分钟 ≤10 次；
  #   超出返回「请稍后重试」。前端另有 2s 防抖（属前端范围）。
  #   ⚠️ 与另外两处策略【分列、不矛盾】：
  #      · 卖家登录【不做】失败次数限制（DEC-25、NFR-03）
  #      · 口令码查询【不做】错误次数限制（DEC-12、NFR-15）
  #   ⚠️ 单后端容器 ⇒ 进程内计数器即可；多副本时须改为共享存储（方案 §5.4）。
  # ---------------------------------------------------------------------------
  rate-limit:
    submit-intention-per-minute: 10

# -----------------------------------------------------------------------------
# 日志：开发环境打开 Hibernate SQL，便于核对 §7 的取数口径（§9.3）
# 业务层新增的审计日志（logger 名 com.simpleshop.audit，NFR-12 的 8 类关键操作）
# 已在 S2 通过 logback-spring.xml 配置为【独立文件 appender + 保留 3 个月】（12-P7），
# 不在此处用 logging.level 配置——级别由该文件的 <logger> 元素指定（INFO）。
# ⚠️ 审计日志文件 logs/audit.log 在【首次有审计记录时】才会生成
#    （S3 起：修改密码会写入第一条）。目录可用 -DAUDIT_LOG_PATH=... 覆盖。
# -----------------------------------------------------------------------------
logging:
  level:
    org.hibernate.SQL: debug
    # 绑定参数值可与 SQL 对照，核对 UTC 写入是否符合预期
    org.hibernate.orm.jdbc.bind: trace

