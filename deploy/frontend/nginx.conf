# =============================================================================
# simple-shop 阶段二 nginx
#   /            -> 买家 SPA（history 回退）
#   /seller/     -> 卖家 SPA（history 回退）
#   /api/        -> backend:8080
#   /media/      -> backend:8080（商品图片与描述媒体）
# =============================================================================
server {
    listen 80;
    server_name _;

    # 后端 multipart 上限 25MB（描述视频 20MB），这里不能小于它，
    # 否则超限请求会先被 nginx 以 413 拒绝，拿不到应用层的业务错误。
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 卖家 SPA ----
    location = /seller {
        return 301 /seller/;
    }

    location /seller/ {
        try_files $uri $uri/ /seller/index.html;
    }

    location /seller/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 买家 SPA ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端接口与媒体 ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /media/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
