# =============================================================================
# simple-shop 阶段二单机容器化部署（Docker Compose）
#   · 买家 SPA 在 /，卖家 SPA 在 /seller/，后端只提供 REST 与 /media
#   · 只有 nginx 暴露宿主端口 80；backend 与 mysql 不映射宿主端口
#   · MySQL 容器只建库，建表与种子数据由后端启动时的 Flyway 完成
#   · 应用用最小权限账号 simpleshop；口令全部来自 deploy/.env（不提交）
#
# 用法：cd deploy && cp .env.example .env && 填口令 && docker compose up -d --build
# 前置：Docker 23+ / Compose v2；后端镜像构建需要能访问 Maven 源
#
# ⚠️ 从阶段一升级：V1 基线已重建，不能复用旧 simple-shop_mysql-data。
#    先备份，再 docker compose down -v（或换项目名/卷名）后首次启动。
# =============================================================================
name: simple-shop

services:

  # ---------------------------------------------------------------------------
  # MySQL 8（独立容器，数据落命名卷）
  # ---------------------------------------------------------------------------
  mysql:
    # 回退官方源：把 .env 里的 IMAGE_PREFIX 设为空即可
    image: ${IMAGE_PREFIX-docker.xuanyuan.me/library/}mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: simple_shop
      MYSQL_USER: ${DB_USERNAME:-simpleshop}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      # 只在数据目录为空（首次初始化）时执行
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [shop-net]

  # ---------------------------------------------------------------------------
  # 后端（可执行 war + JRE21；只提供 REST 与 /media）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../simple-shop-backend
      args:
        REGISTRY: ${IMAGE_PREFIX-docker.xuanyuan.me/library/}
    environment:
      # 保留 connectionTimeZone=UTC 与 characterEncoding=UTF-8；建库交给 mysql 初始化脚本
      DB_URL: "jdbc:mysql://mysql:3306/simple_shop?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&connectionTimeZone=UTC&rewriteBatchedStatements=true"
      DB_USERNAME: ${DB_USERNAME:-simpleshop}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      MEDIA_DIR: /app/data/images
      TZ: UTC
    volumes:
      # ⚠️ 商品图片必须持久化：归档不搬迁图片文件（DEC-09）
      - backend-images:/app/data/images
      # 审计日志保留 3 个月（C-18 / 12-P7）
      - backend-logs:/var/log/simple-shop
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [shop-net]

  # ---------------------------------------------------------------------------
  # 前端 + 反向代理：nginx 同时托管买家 / 与卖家 /seller/，并反代 API/media
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
      args:
        REGISTRY: ${IMAGE_PREFIX-docker.xuanyuan.me/library/}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [shop-net]

volumes:
  mysql-data:
  backend-images:
  backend-logs:

networks:
  shop-net:
    driver: bridge
