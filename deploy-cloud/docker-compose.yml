# =============================================================================
# simple-shop 阶段二单机容器化部署（Docker Compose，云端镜像）
#   · 买家 SPA 在 /，卖家 SPA 在 /seller/，后端只提供 REST 与 /media
#   · 镜像需由构建方用 deploy/ 的同源 Dockerfile 构建并推送；
#     阶段一的 frontend 镜像只含卖家端，不能用于本编排
#   · 只有 nginx 暴露宿主端口 80；backend 与 mysql 不映射宿主端口
#
# 用法：cd deploy-cloud && cp .env.example .env && 填口令
#       docker compose pull && docker compose up -d
# =============================================================================
name: simple-shop

services:

  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy-cloud/.env}
      MYSQL_DATABASE: simple_shop
      MYSQL_USER: ${DB_USERNAME:-simpleshop}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy-cloud/.env}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [shop-net]

  backend:
    image: ${BACKEND_IMAGE:-lrhg173c/simple-shop:backend}
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/simple_shop?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&connectionTimeZone=UTC&rewriteBatchedStatements=true"
      DB_USERNAME: ${DB_USERNAME:-simpleshop}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy-cloud/.env}
      MEDIA_DIR: /app/data/images
      TZ: UTC
    volumes:
      - backend-images:/app/data/images
      - backend-logs:/var/log/simple-shop
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [shop-net]

  frontend:
    image: ${FRONTEND_IMAGE:-lrhg173c/simple-shop:frontend}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [shop-net]

volumes:
  mysql-data:
  backend-images:
  backend-logs:

networks:
  shop-net:
    driver: bridge
