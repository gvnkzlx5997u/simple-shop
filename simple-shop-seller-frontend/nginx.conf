# =============================================================================
# simple-shop 卖家前端独立预览 nginx 配置
#   /seller/  -> 静态 SPA（含 history 回退）
#   /api/     -> backend:8080
#   /media/   -> backend:8080
#   正式部署使用 deploy/frontend 的组合镜像（同时托管买家 / 与卖家 /seller/）。
# =============================================================================
server {
    listen 80;
    server_name _;

    # 后端 multipart 上限 25MB（描述视频 20MB），不能小于它。
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    location = /seller {
        return 301 /seller/;
    }

    location /seller/ {
        try_files $uri $uri/ /seller/index.html;
    }

    location /seller/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # 独立预览没有买家端，根路径直接进入卖家登录。
    location / {
        return 302 /seller/;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
